<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .all {
            text-align: center;
            max-width: 750px;
            /* Shrink width */
            margin: 40px auto;
            /* Center horizontally */
            background-color: #fafbfd;
            /* Inner background color */
            padding: 11px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

        }

        body {
            background-color: #adadad;
        }

        .name p {
            margin-left: -35%;
        }

        .Email p {
            margin-left: -35%;
        }

        .Message p {
            margin-left: -34%;
        }

        .contact p {
            margin-left: -19%;
            font-size: 29px;
        }

        .contact h4 {
            margin-left: -22%;
        }


        .button {
            background-color: #2bb8ed;
            border: none;
            margin-top: 2.5%;
            width: 41%;
            height: 50px;
            border-radius: 5px;
            color: #f9fafc;
            margin-bottom: 4%;
        }

        input {
            width: 40%;
            height: 109px;
            border-radius: 5px;
            
        }
        .Message Input ::placeholder{
            margin-top: 20%;
        }


 
    </style>
</head>

<body>
    <div class="all">
        <div class="contact">
            <p><b> Contact Form</b> </p>
            <h4>Please fill all entries.</h4>
        </div>
        <hr style="width: 40%;">
        <div class="foltyn">
            <div class="name">
                <p>Name:</p>
                <input type="text" name="" id="" placeholder="Your Name" style="height: 26px;">
            </div>
            <div class="Email">
                <p>Email:</p>
                <input type="email" name="" id="" placeholder="Your Email" style="height: 26px;">
            </div>
            <div class="Message">
                <p>Message:</p>
                <input type="text" placeholder="Message">
            </div>
            <button class="button">Send</button>
        </div>
    </div>
</body>

</html>
