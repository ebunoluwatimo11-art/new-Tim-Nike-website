<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Corinthia:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .cheerbear {
            text-align: center;
            font-family: "Corinthia", cursive;
        }

        body {
            background-color: #e74c3c;
        }

        .input1 {
            background-color: transparent;
            color: white;
            border-top: none;
            margin-bottom: 25px;
            border-left: none;
            border-right: none;
            height: 40px;
            width: 90%;
            font-size: 20px;
            border-color: white;
            border-width: 5px;
            margin-top: 60px;
        }

        .input1:focus {
            outline: none;
        }

        ::placeholder {
            color: white;
            font-size: 40px;
            font-family: "Corinthia", cursive;
            font-weight: bolder;
        }

        .funshinebear {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .beadtimebear {
            width: 75%;

        }

        .grumpybear {
            font-size: 55px;
            color: white;
        }

        .fanbear {
            margin-left: 152px;
            transform: scale(3);
        }

        .superherobear {
            margin-left: 152px;
            transform: scale(3);
            margin-bottom: 17px;

        }

        .rainbowbear {
            margin-top: 31px;
            color: white;
            font-family: Corinthia;
            font-size: 40px;
            font-width: 900px;
        }

        .flowerbear {
            color: white;
            font-family: Corinthia;
            font-size: 40px;
            font-width: 900px;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="cheerbear">
        <h1 class="grumpybear">
            Fancy Form
        </h1>
    </div>
    <div class="funshinebear">
        <div class="beadtimebear">
            <input class="input1" type="text" name="" id="" placeholder="username"><br>
            <input class="input1" type="password" name="" id="" placeholder="passwrord">
        </div>
    </div>
    <div class="flowerbear">
        <input type="checkbox" name="" id="male" class="fanbear">
        <label for="male">
            Male
        </label>
    </div>
    <div class="rainbowbear">
        <input type="checkbox" name="" id="female" class="superherobear">
        <label for="female">
            female
        </label>
    </div>

</body>

</html>
